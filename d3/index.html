<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calidad de aire en Cundinamarca</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contenedor principal del dashboard -->
    <div class="dashboard-container">
        <!-- Contenido del dashboard con las dimensiones específicas -->
        <div class="dashboard-content">
            
            <!-- Título principal -->
            <div class="title-section">
                <h1>Calidad de aire en Cundinamarca</h1>
            </div>
            
            <!-- Panel de filtros principales -->
            <div class="filters-panel">
                <div class="filters-header">
                    <h2>Filtro</h2>
                </div>
                
                <!-- Filtro: Agente Contaminante (selección simple) -->
                <div class="filter-row">
                    <span class="filter-label">Agente Contaminante</span>
                    <div class="dropdown-container">
                        <select id="contaminante" class="dropdown single-select">
                            <option value="">Seleccione</option>
                        </select>
                        <div class="dropdown-arrow">▼</div>
                    </div>
                </div>
                
                <!-- Filtro: Estación (selección múltiple con checkboxes) -->
                <div class="filter-row">
                    <span class="filter-label">Estación</span>
                    <div class="custom-dropdown-container">
                        <div class="custom-dropdown-trigger" id="estacion-trigger">
                            <span class="selected-text">Seleccione</span>
                            <div class="dropdown-arrow">▼</div>
                        </div>
                        <div class="custom-dropdown-options" id="estacion-options">
                            <!-- Las opciones se generarán dinámicamente -->
                        </div>
                    </div>
                </div>
                
                <!-- Filtro: Municipio (selección múltiple con checkboxes) -->
                <div class="filter-row">
                    <span class="filter-label">Municipio</span>
                    <div class="custom-dropdown-container">
                        <div class="custom-dropdown-trigger" id="municipio-trigger">
                            <span class="selected-text">Seleccione</span>
                            <div class="dropdown-arrow">▼</div>
                        </div>
                        <div class="custom-dropdown-options" id="municipio-options">
                            <!-- Las opciones se generarán dinámicamente -->
                        </div>
                    </div>
                </div>
                
                <!-- Texto informativo -->
                <div class="info-section">
                    <p>Se está visualizando información de <span id="estaciones-count">0</span> estaciones</p>
                </div>
                
                <!-- Botón de reset -->
                <div class="reset-button-container">
                    <button class="reset-button" id="reset-filters">Resetear Filtros</button>
                </div>
            </div>
            
            <!-- Primera gráfica: Mapa con fuentes fijas -->
            <div class="chart-container map-chart">
                <h2>Fuentes fijas que afectan mediciones cercanas</h2>
                
                <!-- Filtros específicos del mapa -->
                <div class="map-filters">
                    <div class="map-filter-row">
                        <span class="filter-label">Fuente de emisión</span>
                        <div class="dropdown-container">
                            <select id="fuente" class="dropdown">
                                <option value="">Seleccione</option>
                            </select>
                            <div class="dropdown-arrow">▼</div>
                        </div>
                    </div>
                    
                    <div class="map-filter-row">
                        <span class="filter-label">Combustible</span>
                        <div class="dropdown-container">
                            <select id="combustible" class="dropdown">
                                <option value="">Seleccione</option>
                            </select>
                            <div class="dropdown-arrow">▼</div>
                        </div>
                    </div>
                </div>
                
                <!-- Contenedor para la visualización del mapa -->
                <div class="map-visualization">
                    <div class="map-controls">
                        <button id="zoom-in" class="map-control-btn">+</button>
                        <button id="zoom-out" class="map-control-btn">-</button>
                        <button id="reset-view" class="map-control-btn">⤢</button>
                    </div>
                    <svg id="map-svg" width="100%" height="100%"></svg>
                    <div id="map-tooltip" class="map-tooltip"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="modules/DataLoader.js"></script>
    <script src="modules/FilterManager.js"></script>
    <script src="modules/MapManager.js"></script>
    <script src="app.js"></script>
</body>
</html>
